name: Highnote
kind: company
description: Highnote is a modern, unified embedded-finance and banking-as-a-service
  platform for card issuing, card acquiring, credit, and real-time money movement,
  with a built-in real-time programmable ledger and full program management. The
  entire platform is driven by a single GraphQL API at
  https://api.us.highnote.com/graphql (test https://api.us.test.highnote.com/graphql),
  authenticated with a base64-encoded API key over HTTP Basic auth. One endpoint
  covers card products, US person and business account holders (KYC/KYB onboarding),
  financial accounts and credit lines, virtual/physical/tokenized payment cards,
  transaction authorization and clearing, disputes, spend and velocity rules,
  collaborative authorization, multi-rail money movement (ACH, wire, RTP, push-to-card),
  and outbound webhook event notifications. Highnote is a US-based platform serving
  digital-first businesses embedding financial products; access is enterprise,
  contract-gated, with self-serve dashboard signup and a test environment.

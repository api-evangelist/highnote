aid: highnote
name: Highnote
review:
  question: Does Highnote expose a documented public WebSocket or GraphQL subscription API?
  answer: false
  date: '2026-06-20'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. Highnote does not document a public
    WebSocket (ws:// / wss://) endpoint, nor a public GraphQL subscription
    surface, nor HTTP Server-Sent Events (SSE). The Highnote platform is a
    single synchronous GraphQL-over-HTTP endpoint. Asynchronous / realtime
    delivery is handled out-of-band via outbound webhook notification
    targets (Highnote POSTs events to a customer-hosted HTTPS URL) and, for
    authorization decisioning, a collaborative authorization endpoint that
    Highnote calls synchronously during each authorization. Neither is a
    client-subscribed streaming transport, so no AsyncAPI was modeled.
findings:
  summary: |
    Highnote exposes a single GraphQL endpoint at
    https://api.us.highnote.com/graphql (test: https://api.us.test.highnote.com/graphql),
    authenticated with HTTP Basic auth using a base64-encoded API key as the
    username. All operations (queries and mutations) are POST requests with a
    JSON body containing query / variables. There is no documented REST
    surface, no GraphQL subscription type, and no WebSocket endpoint. Realtime
    eventing is delivered via outbound webhooks (addWebhookNotificationTarget +
    addSubscriptionsToNotificationTarget) and the collaborative authorization
    endpoint (addCollaborativeAuthorizationEndpoint), both of which are Highnote
    calling the customer's HTTPS server rather than the customer subscribing to
    a stream.
  transports:
    - protocol: GraphQL over HTTP
      scheme: https
      baseURL: https://api.us.highnote.com/graphql
      documented: true
    - protocol: Webhook (outbound HTTPS POST)
      scheme: https
      note: Highnote POSTs notification events to a customer-registered HTTPS target. Outbound push, not a client subscription.
      documented: true
    - protocol: Collaborative Authorization (outbound HTTPS POST)
      scheme: https
      note: Highnote synchronously calls a customer endpoint during card authorization to collect an approve/decline decision.
      documented: true
    - protocol: GraphQL Subscriptions
      scheme: wss
      documented: false
      note: No subscription type is documented on the Highnote GraphQL schema.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Highnote API reference.
  graphqlConfirmed:
    - POST https://api.us.highnote.com/graphql (live)
    - POST https://api.us.test.highnote.com/graphql (test)
    - Auth - HTTP Basic, base64-encoded API key as username, empty password
    - Pagination - Relay cursor connections (first / after)
    - Features - idempotency keys, HQL search, custom metadata / user-defined fields, rate limiting
sources:
  - url: https://docs.highnote.com/docs/developers/api/using-the-api
    type: Documentation
    note: Confirms single GraphQL endpoint, Basic auth with base64-encoded API key, POST + application/json.
  - url: https://docs.highnote.com/docs/developers/api/intro-to-graphql
    type: Documentation
    note: Single endpoint, Relay cursor connections, ping query, node lookup.
  - url: https://docs.highnote.com/docs/api-reference/mutation
    type: APIReference
    note: Lists mutations including webhook notification targets and collaborative authorization endpoint; no subscriptions.
  - url: https://docs.highnote.com/docs/api-reference/query
    type: APIReference
    note: Lists top-level query fields; no subscription type present.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or subscription protocol surface exists. Realtime delivery is
    outbound webhook push and a synchronous collaborative-authorization
    callback, neither of which is a client-subscribed stream, so no AsyncAPI
    document was authored. The GraphQL surface is modeled in
    graphql/highnote-graphql.md and graphql/highnote-schema.graphql, and the
    GraphQL-over-HTTP endpoint is modeled in openapi/highnote-openapi.yml.
developerSurfaceReview:
  reviewer: API Evangelist
  date: '2026-07-23'
  developerPortal: https://docs.highnote.com/docs/developers/about-developers
  summary: |
    Highnote runs a rich, fully public first-party developer portal at
    docs.highnote.com (Developer Resources > about-developers), organized around
    three product pillars — Issuing, Acquiring, and Money Movement — plus Credit,
    account onboarding, spend controls / collaborative authorization, transactions
    & disputes, and event notifications. Despite the breadth of documented product
    areas, the ENTIRE platform is a SINGLE GraphQL endpoint at
    https://api.us.highnote.com/graphql (test: https://api.us.test.highnote.com/graphql).
    Each product area in this apis.json is modeled as a distinct apis[] entry with
    its own verified humanURL, but all share the one GraphQL baseURL.
  authModel: |
    HTTP Basic authentication. A base64-encoded API key (created in the Highnote
    Dashboard under Developers > API Keys) is supplied as the username with an empty
    password — i.e. Authorization: Basic <base64(apiKey)>. No OAuth2/OIDC, no mTLS,
    no per-request signing documented. Idempotency keys, Relay cursor pagination,
    HQL search, custom metadata, and documented rate limiting are platform features.
  downloadableSpecs: |
    None. Highnote does NOT publish a downloadable OpenAPI/Swagger file, a
    downloadable GraphQL SDL/introspection schema, or a Postman collection on its
    public docs. Developer interaction is via an interactive in-portal API Explorer
    plus the API Reference (Query/Mutation/Object/Input/Enum/Union/Scalar/Interface
    /Union pages). The GitHub org github.com/Highnote-Platform exists but publishes
    no public repositories/SDKs.
  specProvenance: |
    openapi/highnote-graphql-api-openapi.yml is an API-Evangelist-authored, faithful
    OpenAPI 3.0.1 wrapper of the GraphQL-over-HTTP surface (single POST /graphql,
    Basic auth, GraphQL request/response schemas, real example ping/listCardProducts
    /issuePaymentCard operations). It is NOT a vendor-published spec — it models the
    documented transport honestly. The GraphQL surface itself is captured in
    graphql/highnote-graphql.md and graphql/highnote-schema.graphql. No verbatim
    vendor OpenAPI/GraphQL schema was harvestable because Highnote publishes none.
  openFinancePosture: |
    US voluntary open-finance context. Highnote is a card-issuer-processor / BaaS,
    not a deposit bank exposing consumer-permissioned account aggregation, so it is
    not an FDX data provider and states no CFPB 1033 consumer data-access posture of
    its own. Its money-movement product CONSUMES external bank-account linking via
    aggregators (Plaid/Finicity) to fund transfers, rather than exposing an
    aggregator-facing data API. Banking services are delivered through partner
    bank(s); Highnote is the program-management and processing layer.
  verifiedLinks:
    - {url: 'https://highnote.com', status: 200, type: Website}
    - {url: 'https://docs.highnote.com/docs/developers/about-developers', status: 200, type: DeveloperPortal}
    - {url: 'https://docs.highnote.com/docs/issuing/about-issuing', status: 200, type: Documentation}
    - {url: 'https://docs.highnote.com/docs/acquiring/about-acquiring', status: 200, type: Documentation}
    - {url: 'https://docs.highnote.com/docs/money-movement/about-money-movement', status: 200, type: Documentation}
    - {url: 'https://highnote.com/pricing', status: 200, type: Pricing}
    - {url: 'https://highnote.com/blog', status: 200, type: Blog}
    - {url: 'https://status.highnote.com', status: 200, type: StatusPage}
    - {url: 'https://support.highnote.com/hc/en-us', status: 200, type: Support}

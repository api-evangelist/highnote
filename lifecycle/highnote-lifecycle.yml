  detail: >-
    No URL or header version. The GraphQL schema evolves continuously; schema changes are
    classified by criticality (NON_BREAKING, DANGEROUS, BREAKING) and are queryable via the
    schemaChangelogs GraphQL query (changeType + criticality + message).
  docs: https://docs.highnote.com/docs/developers/api/status-changes
deprecation:
  policy: true
  advance_notice_days: 90
  detail: >-
    Highnote provides 90 days advance notice before implementing breaking changes — defined as
    modifications to notifications and/or the API schema that alter existing behavior in a way
    that may break existing client integrations. Additive (non-breaking) changes are logged in
    the API changelog and communicated directly only when they impact business/UX.
  mechanism: 'schemaChangelogs query (criticality: BREAKING) + direct notice'
  docs: https://docs.highnote.com/docs/developers/api/status-changes

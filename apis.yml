- aid: highnote:highnote-acquiring-api
  name: Highnote Acquiring API
  description: Accept and process payments as a merchant acquirer through the
    single GraphQL endpoint. Authorize, capture, charge, and cancel payment
    transactions (authorizePaymentCard, capturePaymentTransaction,
    chargePaymentCard), handle incremental and force captures, and manage the
    acquiring transaction lifecycle. Highnote's unified platform pairs acquiring
    with issuing and a real-time ledger so funds flow can be orchestrated on one
    system of record.
  humanURL: https://docs.highnote.com/docs/acquiring/about-acquiring
  baseURL: https://api.us.highnote.com/graphql
  tags:
  - Card Acquiring
  - Payment Processing
  - Authorizations
  - Clearing
  - Merchant Payments
  - GraphQL

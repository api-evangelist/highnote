apis:
- aid: highnote:highnote-issuing-api
  name: Highnote Issuing API
  description: Create and configure card products (createCardProduct) for debit,
    credit, prepaid, fleet, and charge programs, then issue virtual, physical, and
    tokenized digital payment cards (issuePaymentCardForApplication,
    createPhysicalCardGroupOrder), activate/suspend/close cards, and push-provision
    to Apple Pay and Google Pay. Includes card design, form-factor control, and
    branded or embedded credit product configuration. Driven through the single
    GraphQL endpoint with HTTP Basic auth using a base64-encoded API key.
  humanURL: https://docs.highnote.com/docs/issuing/about-issuing
  baseURL: https://api.us.highnote.com/graphql
  tags:
  - Card Issuing
  - Card Products
  - Payment Cards
  - Virtual Cards
  - Physical Cards
  - Credit
  - GraphQL
  - United States
  properties:
  - type: OpenAPI
    url: openapi/highnote-graphql-api-openapi.yml
  - type: Documentation
    url: https://docs.highnote.com/docs/issuing/about-issuing
  - type: APIReference
    url: https://docs.highnote.com/docs/api-reference/mutation
  - type: GraphQL
    url: graphql/highnote-graphql.md
  - type: Documentation
    url: https://docs.highnote.com/docs/issuing/templates/consumer-prepaid
- aid: highnote:highnote-account-holders-api
  name: Highnote Account Holders & Onboarding API
  description: Onboard US person and US business account holders
    (createUSPersonAccountHolder, createUSBusinessAccountHolder), manage authorized
    users, submit and accept card product applications
    (createAccountHolderCardProductApplication), run KYC/KYB identity verification
    and identity-update flows, and query personAccountHolders and
    businessAccountHolders. Handles the compliance and onboarding lifecycle that
    gates issuing, credit, and money-movement products through the single GraphQL
    endpoint.
  humanURL: https://docs.highnote.com/docs/issuing/accounts/onboarding/onboard-an-account
  baseURL: https://api.us.highnote.com/graphql
  tags:

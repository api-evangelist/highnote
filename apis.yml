    url: graphql/highnote-graphql.md
- aid: highnote:highnote-spend-controls-api
  name: Highnote Spend Controls & Collaborative Authorization API
  description: Attach spend rules and velocity rules to card products and financial
    accounts to govern where, when, and how much can be spent, and register a
    collaborative-authorization endpoint (addCollaborativeAuthorizationEndpoint,
    activateCollaborativeAuthorizationEndpoint) so your own service participates in
    real-time authorization decisions, returning approve or decline responses on
    each card authorization within the network timeout window. Enables programmable
    risk and controls on top of the single GraphQL platform.
  humanURL: https://docs.highnote.com/docs/issuing/spend-controls/collaborative-authorization
  baseURL: https://api.us.highnote.com/graphql
  tags:
  - Spend Controls
  - Velocity Rules
  - Collaborative Authorization
  - Real-time Decisioning
  - Risk
  - GraphQL
  - United States
  properties:
  - type: OpenAPI
    url: openapi/highnote-graphql-api-openapi.yml
  - type: Documentation
    url: https://docs.highnote.com/docs/issuing/spend-controls/collaborative-authorization
  - type: APIReference
    url: https://docs.highnote.com/docs/api-reference/mutation
  - type: GraphQL
    url: graphql/highnote-graphql.md
- aid: highnote:highnote-webhooks-api
  name: Highnote Webhooks & Event Notifications API
  description: Register HTTPS webhook notification targets (addWebhookNotificationTarget),
    activate and deactivate them, and subscribe to event types
    (addSubscriptionsToNotificationTarget) so Highnote pushes account, card,
    transaction, transfer, and application events to your systems in real time
    rather than requiring you to poll the API. Delivered events are also queryable
    via notificationEvents. All configuration runs through the single GraphQL
    endpoint; delivery is outbound HTTPS POST to your registered target.
  humanURL: https://docs.highnote.com/docs/developers/about-developers
  baseURL: https://api.us.highnote.com/graphql
  tags:
  - Webhooks
  - Event Notifications
  - Events
  - Subscriptions
  - Real-time
  - GraphQL
  - United States

description: >-
  Highnote does not publish public, self-serve API pricing. Pricing is sales-led
  and structured around each program: platforms earn revenue from interchange on
  branded cards, fees on transaction processing and instant payouts, and interest
  income on embedded credit programs, while Highnote charges program / platform and
  per-transaction fees negotiated per agreement. There are no published Free /
  Developer / Enterprise tiers; access begins in a test environment and live
  programs require a signed agreement. Specific rates are not reconciled in this
  artifact.
notes: >-
  Pricing is contract-based and not published. Confirm program fees, interchange
  share, and per-transaction pricing directly with Highnote sales during
  reconciliation.

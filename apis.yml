- aid: highnote:highnote-transactions-api
  name: Highnote Transactions & Disputes API
  description: Query and manage the full payment transaction lifecycle
    (paymentTransactions, transactionBatches) with HQL search and Relay cursor
    pagination, read pending, cleared, and settled states against the real-time
    ledger, and initiate and track cardholder transaction disputes
    (initiateCustomerCardTransactionDispute). Covers authorizations, clearings,
    reversals, and refunds surfaced through the single GraphQL endpoint.
  humanURL: https://docs.highnote.com/docs/issuing/transactions/transaction-lifecycle
  baseURL: https://api.us.highnote.com/graphql
  tags:
  - Transactions
  - Disputes
  - Clearing
  - Ledger
  - Reporting
  - GraphQL
  - United States

- aid: highnote:highnote-money-movement-api
  name: Highnote Money Movement API
  description: Move funds across multiple payment rails from a single API surface
    (initiateTransferBetweenFinancialAccounts, initiateAchTransfer,
    initiateUnifiedFundsTransfer). Supports standard and same-day ACH, domestic
    wire, Real-Time Payments (RTP), and near-real-time push-to-card via Mastercard
    Move and Visa Direct, with FedNow noted as coming soon. On-us transfers between
    Highnote financial accounts settle instantly; external transfers route over
    the appropriate network rail based on cost, speed, and destination.
  humanURL: https://docs.highnote.com/docs/money-movement/about-money-movement
  baseURL: https://api.us.highnote.com/graphql
  tags:
  - Money Movement
  - ACH
  - Wire Transfers
  - RTP
  - Instant Payments
  - Push to Card
  - GraphQL
  - United States
